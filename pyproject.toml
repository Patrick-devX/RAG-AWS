[project]
name = "docpilot"
version = "0.1.0"
description = "A RAG system on AWS, built step by step."
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.40",              # the AWS SDK for Python: talks to Bedrock, S3, IAM ...
    "pydantic-settings>=2.4",   # reads our settings from the .env file
    "aws-cdk-lib>=2.160",       # AWS infrastructure written in Python (budget in Step 13)
    "constructs>=10.3",         # building blocks that aws-cdk-lib needs
]

[dependency-groups]
dev = [
    "pytest>=8.3",              # runs our tests
    "ruff>=0.6",                # checks code style and finds simple mistakes
]

[tool.uv]
package = false                 # this is an application, not a library to publish

[tool.pytest.ini_options]
testpaths = ["tests"]           # where tests live (folder comes later)
pythonpath = ["."]              # lets tests import our own code

[tool.ruff]
line-length = 100